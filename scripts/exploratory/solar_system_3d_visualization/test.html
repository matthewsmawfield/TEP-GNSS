<!DOCTYPE html>
<html>
<head>
    <title>Three.js Test</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="testCanvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        console.log('Testing Three.js...');

        try {
            // Check if THREE is loaded
            if (typeof THREE === 'undefined') {
                throw new Error('THREE.js not loaded');
            }
            console.log('✅ THREE.js loaded:', THREE.REVISION);

            // Check if OrbitControls is loaded
            if (typeof OrbitControls === 'undefined') {
                throw new Error('OrbitControls not loaded');
            }
            console.log('✅ OrbitControls loaded');

            // Basic scene setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('testCanvas') });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Add a simple cube
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            camera.position.z = 5;

            // Animation
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            console.log('🎉 Three.js test successful!');

        } catch (error) {
            console.error('❌ Test failed:', error);
            document.body.innerHTML = '<h1 style="color: red;">Error: ' + error.message + '</h1>';
        }
    </script>
</body>
</html>
