<!DOCTYPE html>
<html>
<head>
    <title>Debug - Solar System Visualization</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .debug-info { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>🔧 Debug Information</h1>

    <div class="debug-info">
        <h2>Browser Information</h2>
        <p><strong>User Agent:</strong> <span id="userAgent"></span></p>
        <p><strong>WebGL Support:</strong> <span id="webglSupport"></span></p>
        <p><strong>Canvas Support:</strong> <span id="canvasSupport"></span></p>
    </div>

    <div class="debug-info">
        <h2>Script Loading</h2>
        <p><strong>THREE.js:</strong> <span id="threeStatus"></span></p>
        <p><strong>OrbitControls:</strong> <span id="orbitControlsStatus"></span></p>
    </div>

    <div class="debug-info">
        <h2>Canvas Test</h2>
        <canvas id="testCanvas" width="200" height="100" style="border: 1px solid #ccc;"></canvas>
        <p><strong>Canvas Context:</strong> <span id="canvasContext"></span></p>
    </div>

    <div class="debug-info">
        <h2>Actions</h2>
        <button onclick="testThreeJS()">Test Three.js</button>
        <button onclick="window.location.href='index.html'">Go to Main Visualization</button>
    </div>

    <div id="testResults" class="debug-info" style="display: none;">
        <h2>Test Results</h2>
        <pre id="testOutput"></pre>
    </div>

    <script>
        // Browser information
        document.getElementById('userAgent').textContent = navigator.userAgent;

        // WebGL support check
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        document.getElementById('webglSupport').textContent =
            gl ? '✅ Supported' : '❌ Not Supported';
        document.getElementById('webglSupport').className = gl ? 'success' : 'error';

        // Canvas support
        document.getElementById('canvasSupport').textContent =
            !!document.createElement('canvas').getContext ? '✅ Supported' : '❌ Not Supported';
        document.getElementById('canvasSupport').className =
            !!document.createElement('canvas').getContext ? 'success' : 'error';

        // Script loading checks
        function checkScriptLoaded(scriptName, expectedObject) {
            if (typeof window[expectedObject] !== 'undefined') {
                return '✅ Loaded';
            }
            return '❌ Not Loaded';
        }

        // Check THREE.js (loaded via CDN)
        setTimeout(() => {
            document.getElementById('threeStatus').textContent = checkScriptLoaded('THREE.js', 'THREE');
            document.getElementById('threeStatus').className = typeof THREE !== 'undefined' ? 'success' : 'error';
        }, 500);

        // Check OrbitControls (loaded via CDN)
        setTimeout(() => {
            document.getElementById('orbitControlsStatus').textContent = checkScriptLoaded('OrbitControls', 'OrbitControls');
            document.getElementById('orbitControlsStatus').className = typeof OrbitControls !== 'undefined' ? 'success' : 'error';
        }, 1000);

        // Canvas context test
        const testCanvas = document.getElementById('testCanvas');
        const ctx = testCanvas.getContext('2d');
        document.getElementById('canvasContext').textContent =
            ctx ? '✅ 2D Context Available' : '❌ No 2D Context';
        document.getElementById('canvasContext').className = ctx ? 'success' : 'error';

        if (ctx) {
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(10, 10, 50, 50);
            ctx.fillStyle = '#2196F3';
            ctx.fillText('Canvas OK', 70, 30);
        }

        // Test function
        window.testThreeJS = function() {
            const results = document.getElementById('testResults');
            const output = document.getElementById('testOutput');

            results.style.display = 'block';
            output.textContent = 'Running Three.js test...\n';

            try {
                if (typeof THREE === 'undefined') {
                    throw new Error('THREE.js not loaded');
                }

                output.textContent += '✅ THREE.js is available\n';

                const scene = new THREE.Scene();
                output.textContent += '✅ Scene created\n';

                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                output.textContent += '✅ Camera created\n';

                const renderer = new THREE.WebGLRenderer({ canvas: testCanvas });
                output.textContent += '✅ WebGL Renderer created\n';

                if (typeof OrbitControls !== 'undefined') {
                    const controls = new OrbitControls(camera, renderer.domElement);
                    output.textContent += '✅ OrbitControls created\n';
                } else {
                    output.textContent += '⚠️ OrbitControls not available\n';
                }

                output.textContent += '\n🎉 All tests passed! Three.js is working correctly.';

            } catch (error) {
                output.textContent += '\n❌ Test failed: ' + error.message;
            }
        };
    </script>
</body>
</html>
